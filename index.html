<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롯데월드 동선짜기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* one column, phone-first: status bar, one action card, candidates, log */
  --bg:#F3F5F8;--panel:#FFFFFF;--ink:#152238;--ink-2:#5B6880;--line:#DCE1EA;
  --accent:#0F6E64;--accent-soft:#E2F2EF;
  --ok:#2E7D32;--ok-bg:#E7F4E8;--warn:#A15C00;--warn-bg:#FCF0DC;--bad:#B42318;--bad-bg:#FCE9E7;
  --font-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--panel:#162033;--ink:#E8EDF5;--ink-2:#9AA7BD;--line:#2A3650;--accent:#4CC2B0;--accent-soft:#16352F;--ok:#7BCB7F;--ok-bg:#1B3220;--warn:#F2B866;--warn-bg:#3A2A10;--bad:#F2877B;--bad-bg:#3D1A17;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E1420;--panel:#162033;--ink:#E8EDF5;--ink-2:#9AA7BD;--line:#2A3650;--accent:#4CC2B0;--accent-soft:#16352F;--ok:#7BCB7F;--ok-bg:#1B3220;--warn:#F2B866;--warn-bg:#3A2A10;--bad:#F2877B;--bad-bg:#3D1A17;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:12px 16px 40px;display:grid;gap:14px}
.num{font-variant-numeric:tabular-nums}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.clock{font-family:var(--font-display);font-size:46px;line-height:1}
.where{font-size:14px;color:var(--ink-2)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 10px;border-radius:999px;font-size:13px;background:var(--panel);border:1px solid var(--line);white-space:nowrap}
.chip.hot{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.label{font-size:13px;color:var(--ink-2)}
.big{font-family:var(--font-display);font-size:30px;line-height:1.15}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;min-height:46px}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600;font-size:17px}
:root[data-theme="dark"] .go{color:#0E1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .go{color:#0E1420}}
.ghost{background:transparent}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cand{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;text-align:left;width:100%}
.cand .nm{font-weight:600}
.cand .sub{font-size:13px;color:var(--ink-2)}
.cand.top{border-color:var(--accent);background:var(--accent-soft)}
.list{display:grid;gap:8px}
.wait{display:flex;align-items:center;gap:8px}
.wait input{width:100px;font-family:var(--font-display);font-size:30px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:4px}
.res{border-radius:12px;padding:12px 14px;font-weight:600}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.bad{background:var(--bad-bg);color:var(--bad)}
.res span{display:block;font-weight:400;font-size:14px}
.log{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.log li{display:flex;gap:12px;font-size:15px;padding:6px 0;border-bottom:1px solid var(--line)}
.log li span:first-child{color:var(--ink-2);min-width:44px}
details{font-size:14px;color:var(--ink-2)}
details[open]{display:grid;gap:10px}
summary{cursor:pointer;padding:6px 0}
.set{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.set input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.set input[type=time]{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px 8px}
.cand .mx b{display:block;font-family:var(--font-display);font-weight:400;font-size:20px}
.cand.ok .mx b{color:var(--ok)}.cand.tight .mx b{color:var(--warn)}.cand.no .mx b{color:var(--bad)}
.estrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.estrow>div{background:var(--bg);border-radius:12px;padding:10px 12px}
.estrow b{font-family:var(--font-display);font-weight:400;font-size:30px;margin-right:6px}
.estrow b.okc{color:var(--ok)}
.chip.cal{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.bdg{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:500;background:var(--bg);color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge svg{width:13px;height:13px;flex:none}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.tight,.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.no{background:var(--bad-bg);color:var(--bad)}
.badge.lg{font-size:17px;padding:6px 14px;font-weight:600}
.tbar{position:relative;height:10px;margin:4px 0}
.tbar .trk{position:absolute;inset:0;border-radius:5px;background:var(--bg);overflow:hidden}
.tbar.big{height:20px;margin:24px 0 26px}
.tbar.big .trk{border-radius:10px}
.seg{position:absolute;top:0;bottom:0}
.seg.tr{background:var(--line)}.seg.ok{background:var(--ok)}.seg.tight{background:var(--warn)}.seg.no{background:var(--bad)}.seg.rd{background:var(--ink-2)}
.rng{position:absolute;top:-3px;bottom:-3px;border:1.5px dashed var(--ink-2);border-radius:5px;opacity:.6}
.dl{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.ax{position:absolute;font-size:12px;color:var(--ink-2);white-space:nowrap;transform:translateX(-50%);font-variant-numeric:tabular-nums}
.ax.dn{top:100%;margin-top:6px}.ax.up{bottom:100%;margin-bottom:6px;color:var(--ink);font-weight:600}
.ax.l{transform:none}
.legend{display:flex;gap:12px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.cand{grid-template-columns:minmax(0,1fr) auto!important;gap:6px 10px!important}
.cand .tbar,.cand .bdg{grid-column:1/-1}
.prog{height:14px;border-radius:7px;background:var(--bg);overflow:hidden}
.prog>div{height:100%;background:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tabs button{min-height:42px;font-weight:600;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .tabs button[aria-selected="true"]{color:#0E1420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tabs button[aria-selected="true"]{color:#0E1420}}
.pane{display:grid;gap:14px}
.alist,.plist{list-style:none;margin:0;padding:0;display:grid}
.alist li{display:grid;gap:5px;padding:10px 0;border-bottom:1px solid var(--line)}
.alist li:last-child,.plist li:last-child{border-bottom:0}
.arow{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.nm{font-weight:600}.sub{font-size:13px;color:var(--ink-2)}
.off .nm{color:var(--ink-2)}
.badge.end{background:var(--line);color:var(--ink-2)}
.plist li{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.plist .tm{font-family:var(--font-display);font-size:20px}
.plist li.next{background:var(--accent-soft);margin:0 -10px;padding:10px;border-radius:10px;border-bottom:0}
a{color:var(--accent)}
.alist li{grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.ainfo{display:grid;gap:5px;grid-column:-2/-1}
img.th{width:56px;height:56px;object-fit:cover;border-radius:10px;background:var(--bg)}
.nmw{display:flex;align-items:center;gap:10px;min-width:0}
img.tc{width:36px;height:36px;object-fit:cover;border-radius:10px;background:var(--bg);flex:none}
img.hero{width:33%;max-width:170px;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:var(--bg);flex:none}
.herow{display:flex;gap:12px;align-items:center}.herow>div{flex:1;min-width:0}
.off img{filter:grayscale(1);opacity:.6}
.chk{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--ink-2);cursor:pointer;flex:none;border-radius:50%}
.chk svg{width:22px;height:22px;fill:none}
.chk.on{color:#E5A100}.chk.on svg{fill:currentColor}
.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nmw{flex:1}.nmw .chk{margin-left:auto}
.notice ul{margin:0;padding-left:18px;display:grid;gap:6px;color:var(--ink);font-size:14px}
.notice b{font-weight:600;margin-right:4px}
.cds{display:grid;gap:8px;flex:1;max-width:250px;min-width:150px}
.cds{cursor:pointer;flex:1;max-width:300px;min-width:150px;display:grid;gap:6px}
.cdt{display:flex;justify-content:flex-end;gap:5px;font-size:13px;color:var(--ink-2)}
.cdt b{font-weight:600;color:var(--ink)}
.cdt{align-items:center}.cdi{display:inline-flex;color:var(--accent)}.cdi svg{width:18px;height:18px}
.cd1.hot .cdi{color:var(--warn)}
.cdb{position:relative;height:14px;border-radius:7px;background:var(--line);overflow:hidden;margin-top:5px}
.cdb i{display:block;height:100%;border-radius:7px;background:var(--accent);transition:width .6s}
.cdb u{position:absolute;top:0;bottom:0;width:3px;margin-right:-1.5px;background:var(--panel);opacity:.9}
.cd1.hot .cdb i{background:var(--warn)}.cd1.hot .cdt b{color:var(--warn)}
.cds .chip{justify-self:end}
.tap{cursor:pointer}
.ptm{width:56px;height:56px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:19px}
.off .ptm{background:var(--bg);color:var(--ink-2)}
.detail{grid-column:1/-1;display:grid;gap:6px;background:var(--bg);border-radius:12px;padding:12px;cursor:default}
.drow{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.drow span{color:var(--ink-2)}.drow b{font-weight:500;text-align:right}
img.dimg{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-bottom:4px;filter:none!important;opacity:1!important}
.gobtn{margin-top:6px}
.nextprev{border-top:1px dashed var(--line);padding-top:12px}
.nextprev .cand{cursor:default;opacity:1}
.nextprev .chk{pointer-events:auto}
.rcode{font-family:var(--font-display);font-size:24px;color:var(--ink);margin:0 4px}
#resetIn{width:72px;text-align:center;font-family:var(--font-display);font-size:22px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:6px}
.sorts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.sorts button{min-height:32px;padding:4px 10px;font-size:13px;border-radius:999px;color:var(--ink-2)}
.sorts button[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.cand{position:relative;overflow:hidden}
.cand .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.cand.hasimg{border-color:transparent;background:#101826;min-height:150px;align-content:end;padding:14px}
.cand.hasimg .bgimg{opacity:1}
.cand.hasimg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.4)}
.cand.hasimg.grad{background:linear-gradient(35deg,#2a9d9b 0%,#c99a3e 50%,#c24c57 100%)}
.cand.hasimg.grad::after{background:rgba(0,0,0,.12)}
#tabPerf .ptm{background:linear-gradient(35deg,#2a9d9b 0%,#c99a3e 50%,#c24c57 100%);color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.35)}
#tabPerf .off .ptm{background:var(--bg);color:var(--ink-2);text-shadow:none}
.cand.hasimg>*:not(.bgimg){position:relative;z-index:1}
.cand.hasimg .nm{color:#fff;font-size:19px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.cand.hasimg .badge{background:rgba(255,255,255,.18);color:#fff;-webkit-backdrop-filter:blur(10px) saturate(1.4);backdrop-filter:blur(10px) saturate(1.4);border:1px solid rgba(255,255,255,.22)}
.cand.hasimg .badge.ok{background:rgba(46,160,67,.55)}.cand.hasimg .badge.tight,.cand.hasimg .badge.warn{background:rgba(214,140,20,.6)}.cand.hasimg .badge.no{background:rgba(207,54,40,.65)}
.cand.hasimg .tbar .trk{background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cand.hasimg .seg.tr{background:rgba(255,255,255,.55)}.cand.hasimg .seg.rd{background:rgba(255,255,255,.85)}
.cand.hasimg .seg.ok{background:#4ad06a}.cand.hasimg .seg.tight{background:#f5b53c}.cand.hasimg .seg.no{background:#ff6b5e}
.cand.hasimg .rng{border-color:#fff}.cand.hasimg .dl{background:#fff}
.cand.hasimg .chk{color:#fff}.cand.hasimg .chk.on{color:#ffd24a}
.cand.hasimg.top{box-shadow:0 0 0 2px var(--accent)}
.lcol{display:inline-grid;justify-items:start}
.wherebtn{display:flex;align-items:center;gap:4px;width:0;min-width:100%;min-height:32px;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;margin-top:2px;border-color:var(--accent);color:var(--accent);background:var(--accent-soft);white-space:nowrap}
.wherebtn{position:relative;height:32px;align-items:flex-end;padding:0 10px 3px;line-height:1.2;margin-top:6px}
.wlab{position:absolute;top:2px;left:0;right:0;text-align:center;font-size:8.5px;font-weight:500;line-height:1;opacity:.75;pointer-events:none}
.wv{flex:1;min-width:0;overflow:hidden;text-align:center}
#whereTxt{display:inline-block;white-space:nowrap}
@keyframes mq{0%,18%{transform:translateX(0)}82%,100%{transform:translateX(var(--mq))}}
@media (prefers-reduced-motion:no-preference){#whereTxt.mq{animation:mq 6s ease-in-out infinite alternate}}
#simTag{margin-top:2px}
.mini{min-height:32px;padding:4px 12px;font-size:13px}
.loclist{list-style:none;margin:0;padding:0}
.loclist li{border-bottom:1px solid var(--line)}.loclist li:last-child{border-bottom:0}
.loclist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;border-radius:0;background:transparent;padding:12px 4px;min-height:46px;text-align:left;font-size:16px}
.loclist small{font-size:12px;color:var(--ink-2);white-space:nowrap}
.loclist button[aria-current="true"]{color:var(--accent);font-weight:600}
#locPick{padding:4px 16px}
#clock{cursor:pointer}
.wait select{font-family:inherit;font-size:16px;text-align:center;text-align-last:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px 10px;min-height:38px}
.ptm.sh{background:var(--warn-bg);color:var(--warn)}.ptm.no{background:var(--bad-bg);color:var(--bad)}
.tabs button{padding:8px 4px}
.pset{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;padding:8px 10px;white-space:nowrap;overflow-x:auto}
.pset select{-webkit-appearance:none;appearance:none;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:6px 9px;min-height:36px;font:inherit;font-size:14px;text-align:center;text-align-last:center;min-width:0;flex:0 1 auto}
.pset .pic{display:inline-flex;color:var(--ink-2);margin-left:2px}.pset .pic svg{width:15px;height:15px}
.pset .mini{margin-left:auto;padding:4px 8px;min-height:36px;font-size:13px;flex:none}
main{min-width:0}.pane{min-width:0}
.plan li{grid-template-columns:auto minmax(0,1fr) auto auto!important;align-items:center}
.plan .ainfo{grid-column:auto}
.updn{display:grid;gap:4px}
.updn button{width:36px;height:30px;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--ink-2)}
.updn button svg{width:16px;height:16px}.updn .dn svg{transform:rotate(180deg)}
.updn button:disabled{opacity:.3;cursor:default}
.gaprow{padding:6px 0!important;display:block!important}
.gaprow button{width:100%;display:flex;align-items:center;gap:10px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-2);min-height:44px}
.gaprow b{color:var(--accent);font-size:20px;line-height:1}.gaprow small{margin-left:auto;font-size:12px}
.plan .ptm{position:relative}
.pnum{position:absolute;top:-7px;left:-7px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:tomato;color:#fff;font:600 12px/20px var(--font-body);font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--panel)}
.cand .bdg{flex-wrap:nowrap;gap:4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cand .bdg::-webkit-scrollbar{display:none}
.cand .bdg{gap:3px}
.cand .bdg .badge{font-size:11px;padding:3px 6px;gap:2px;flex:none;letter-spacing:-.02em}
.cand .bdg .badge svg{width:11px;height:11px}
.badge.ty{padding:0;width:24px;height:24px;justify-content:center;border-radius:50%;flex:none;background:var(--bg);color:var(--ink-2)}
.badge.ty svg{width:14px;height:14px}
.badge.ty{color:#fff!important;border:0!important;box-shadow:0 0 0 2px var(--panel)}
.badge.ty.rec{background:#F59E0B!important}
.badge.ty.attr{background:#2563EB!important}
.badge.ty.show{background:#9333EA!important}
.cand.hasimg .badge.ty{box-shadow:0 0 0 2px rgba(255,255,255,.85);-webkit-backdrop-filter:none;backdrop-filter:none}
.cand{height:148px;padding-top:38px!important;align-content:start!important;min-height:0!important}
.cand .tys{position:absolute!important;top:8px;left:8px;display:flex;gap:4px;z-index:2}
.cand .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cand .nmw{min-width:0;overflow:hidden}
.cand.hasimg .badge.ty.rec{background:rgba(15,110,100,.85)}
.morebtn{width:100%;color:var(--ink-2);font-weight:600}
.rt{display:inline-flex;gap:4px;align-items:center;justify-self:end}
.cand .rt{position:absolute!important;top:8px;right:10px;z-index:2}
.cand .nmw{grid-column:1/-1}
.badge.live{font-size:12px;padding:3px 8px}
.badge.live.ok::before,.badge.live.warn::before,.badge.live.no::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.cand.hasimg .badge.live.end{background:rgba(120,130,150,.6)}
.hide{display:none!important}
.amap{position:relative;margin-top:10px;border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line);cursor:zoom-in}
.amap img{display:block;width:100%;height:auto}
.amap .pin,.mapbox .pin{position:absolute;width:22px;height:22px;transform:translate(-50%,-50%);border-radius:50%;background:#e5484d;border:3px solid #fff;box-shadow:0 0 0 2px rgba(229,72,77,.45),0 2px 6px rgba(0,0,0,.35)}
.amap .pin::after,.mapbox .pin::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px solid rgba(229,72,77,.6);animation:pinp 1.6s ease-out infinite}
@keyframes pinp{from{transform:scale(.6);opacity:1}to{transform:scale(1.6);opacity:0}}
.amap .mcap{position:absolute;right:8px;bottom:8px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.55);color:#fff}
.amap.ld{min-height:60px;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--ink-2);cursor:default}
.mapov{position:fixed;inset:0;z-index:100;background:#eef1f5;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y pinch-zoom}
.mapov .mapbox{position:relative;width:max(100vw,1100px);margin:60px auto 24px}

function tod(t,z){
  let f=t<toM('17:00')?1:t<toM('18:00')?0.95:t<toM('19:00')?0.75:t<toM('20:00')?0.65:t<toM('20:30')?(z==='MI'?0.6:0.5):0.55;
  if(z==='MI'&&t>=toM('18:00'))f*=0.9;
  return f;
}
function est(p,t){
  if(p.fixedWait)return {e:p.base,lo:p.base,hi:p.base};
  const e=p.base*tod(t,p.z)*DAY*S.cal;
  return {e:r5(e),lo:r5(e*0.75),hi:r5(e*1.25)};
}

function kst(){const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());const g=t=>+p.find(x=>x.type===t).value;return g('hour')*60+g('minute')}

function nextFixed(t){return fixedList().find(f=>toM(f.end)>t)}
function deadlineFor(p,t){
  let dl=Infinity;const nf=nextFixed(t);
  if(nf)dl=toM(nf.arrive)-travel(p.n,nf.n);
  if(p.close)dl=Math.min(dl,toM(p.close));
  return Math.min(dl,PE());
}

function observe(p,t,actual){
  if(p.fixedWait)return;
  const raw=p.base*tod(t,p.z)*DAY;if(raw<=0)return;
  const ratio=Math.min(3,Math.max(0.3,actual/raw));
  S.obs.push(ratio);
  let w=0,sum=0;S.obs.forEach((r,i)=>{const k=i+1;w+=k;sum+=r*k});
  S.cal=Math.round(sum/w*100)/100;
}

function candidates(tOv,fromOv,exId){
  const t=tOv??eff(),from=fromOv??S.loc,out=[];
  const allP=PLACES.concat(ATTR.map(placeOf).filter(p=>p&&!PLACES.includes(p)));
  allP.forEach(p=>{
    if(CLOSED.includes(p.id)||p.id===exId)return;
    if(liveBlocked(attrOf(p))&&!(S.queue&&S.queue.id===p.id))return;
    const n=S.done[p.id]||0;if(n>=(p.repeat||1))return;
    const tr=travel(from,p.n),arr=t+tr;
    if(p.from&&arr<toM(p.from))return;
    const mw=Math.floor(deadlineFor(p,t)-arr-p.ride);
    const x=est(p,arr);
    const fit=x.hi<=mw?'ok':x.e<=mw?'tight':'no';
    let sc=p.pri*10-tr*1.5-x.e*0.35;
    if(p.flag)sc-=8;
    const must=isMust(p);if(must)sc+=80;
    if(fit==='tight')sc-=25;
    out.push({p,mw,sc,tr,x,fit,must,cur:PLACES.includes(p)&&!!p.g});
  });
  const rank={ok:0,tight:1,no:2};
  const grp=c=>c.fit==='no'?3:c.must?0:rank[c.fit]+1;
  return out.sort((a,b)=>grp(a)-grp(b)||b.sc-a.sc);
}
function fixedDue(){
  const t=eff(),nf=nextFixed(t);if(!nf)return null;
  const leaveBy=toM(nf.arrive)-travel(S.loc,nf.n);
  const anyFits=candidates().some(c=>c.fit!=='no'&&c.mw>=5);
  if(t>=leaveBy-5||!anyFits)return {f:nf,leaveBy};
  return null;
}

function bar(o){

  const pc=m=>Math.min(100,Math.max(0,m/S*100)).toFixed(2)+'%';
  const fit=o.fit||fitFor(o.w,o.mw);
  let h='<div class="tbar'+(o.big?' big':'')+'" role="img" aria-label="이동 '+o.tr+'분, 대기 '+o.w+'분, 탑승 '+o.ride+'분, 마감까지 '+B+'분"><div class="trk">'+

   '<div class="seg rd" style="left:'+pc(o.tr+o.w)+';width:'+pc(o.ride)+'"></div></div>';
  if(o.lo!=null&&o.hi>o.lo)h+='<div class="rng" style="left:'+pc(o.tr+o.lo)+';width:'+pc(o.hi-o.lo)+'"></div>';

function planRides(){
  const ord=S.order||[],ks=Object.keys(S.must).filter(k=>k[0]==='A');
  const keys=ord.filter(k=>S.must[k]).concat(ks.filter(k=>!ord.includes(k)));
  return keys.map(k=>{const a=ATTR.find(x=>aKey(x)===k),p=placeOf(a);return p?{k,p}:null}).filter(Boolean)
    .filter(r=>!S.done[r.p.id]&&!CLOSED.includes(r.p.id)&&!(S.queue&&S.queue.id===r.p.id));
}
function planSim(){
  const items=[];let t=eff(),loc=S.loc;
  if(S.queue){items.push({k:'now',name:S.queue.name,s:S.queue.start??t,e:Math.max(S.queue.end,t)});t=Math.max(S.queue.end,t);loc=S.queue.n}
  const fx=fixedList().filter(f=>toM(f.end)>t&&!(S.queue&&S.queue.id===f.id)),unfit=[];let c=t,pos=0;
  const gap=(to,toLoc)=>{if(to-c>=15)items.push({k:'gap',s:c,e:to,loc,pos})};
  const show=()=>{const nf=fx.shift(),tr=travel(loc,nf.n),mk=nf.id==='mk',st=mk?Math.max(toM(nf.start),t+tr):toM(nf.start);
    gap(toM(nf.arrive)-tr);items.push({k:'show',f:nf,name:nf.name,s:st,e:toM(nf.end),tr,late:!mk&&t+tr>toM(nf.start)});t=Math.max(t+tr,toM(nf.end));c=t;loc=nf.n};
  const fits=(p,t0,loc0,nf)=>{const tr=travel(loc0,p.n),arr=t0+tr,w=est(p,arr).e,fin=arr+w+p.ride;
    let dl=Math.min(p.close?toM(p.close):1e9,PE());if(nf)dl=Math.min(dl,toM(nf.arrive)-travel(p.n,nf.n));return fin<=dl?{tr,arr,w,fin}:null};
  planRides().forEach(r=>{const p=r.p;
    let k=0,tt=t,ll=loc,ok=null;
    for(;;){const nf=fx[k];ok=fits(p,tt,ll,nf);if(ok||!nf||nf.id==='mk')break;tt=Math.max(tt+travel(ll,nf.n),toM(nf.end));ll=nf.n;k++}
    if(!ok){unfit.push(r);pos++;return}
    while(k-->0)show();
    const f=fits(p,t,loc,fx[0]);items.push({k:'ride',key:r.k,p,name:p.name,s:f.arr,e:f.fin,tr:f.tr,w:f.w});t=f.fin;c=t;loc=p.n;pos++});
  while(fx.length){if(fx[0].id==='mk')gap(Math.min(PE(),toM(fx[0].arrive)));show()}
  return {items,unfit};
}
function autoOrder(){
  const rides=planRides().map(r=>r.p),fx=fixedList().filter(f=>toM(f.end)>eff()&&f.id!=='mk');let best=null,nodes=0;
  (function go(t,loc,rs,fi,acc){
    if(++nodes>30000)return;const nf=fx[fi];let moved=false;
    for(const p of rs){const tr=travel(loc,p.n),arr=t+tr,fin=arr+est(p,arr).e+p.ride;
      let dl=Math.min(p.close?toM(p.close):1e9,PE());if(nf)dl=Math.min(dl,toM(nf.arrive)-travel(p.n,nf.n));
      if(fin<=dl){moved=true;go(fin,p.n,rs.filter(x=>x!==p),fi,acc.concat([p]))}}
    if(nf)go(Math.max(t+travel(loc,nf.n),toM(nf.end)),nf.n,rs,fi+1,acc);
    else if(!moved||!rs.length){const pr=acc.reduce((x,p)=>x+p.pri,0);if(!best||acc.length>best.n||(acc.length===best.n&&pr>best.pr))best={n:acc.length,pr,acc,left:rs}}
  })(eff(),S.loc,rides,0,[]);
  if(best)S.order=best.acc.concat(best.left).map(p=>aKey(attrOf(p)));
}

    '<div class="bdg">'+bdg('','','이동 '+tr+'분')+bdg('','','시작 '+r[0])+bdg('','','마감 '+f.end)+bdg('','',r[2])+'</div>';
  b.querySelector('.nm').textContent=r[1];
  const im=b.querySelector('.bgimg');if(im){im.onload=()=>{IMGOK[src]=true};im.onerror=()=>{IMGOK[src]=false;im.remove();b.classList.add('grad')}}
  b.setAttribute('aria-label','공연 '+r[1]+', '+r[0]+', 이동 '+tr+'분');
  b.onclick=()=>{S.sel=f.id;S.wait='';save();render();window.scrollTo({top:0,behavior:'smooth'})};
  return b;
}

/* attraction location map from the official detail page (map image + pin), loaded on demand.
   official pin icon is 44x58 drawn from (x,y) top-left, so the tip is at (x+22, y+58) */
const MAPS={};
function mapHTML(a){if(!a||!a.id)return '';const m=MAPS[a.id];if(m===undefined)loadMap(a.id);
  if(!m||m==='loading')return '<div class="amap ld" data-map="'+a.id+'">지도 불러오는 중</div>';if(m==='none')return '';
  return '<div class="amap" data-map="'+a.id+'" role="button" tabindex="0" aria-label="'+a.nm+' 위치 지도 크게 보기"><img alt="'+a.nm+' 위치 지도" loading="lazy" src="'+m.src+'"><span class="pin" style="left:'+m.px+'%;top:'+m.py+'%"></span><span class="mcap">크게 보기</span>'+mapTag(m)+'</div>'}
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mapTag=m=>(m.fl||m.loc)?'<span class="mtag">'+(m.fl?'<b>'+escH(m.fl)+'</b>':'')+(m.loc?'<span>'+escH(m.loc)+'</span>':'')+'</span>':'';
async function loadMap(id){MAPS[id]='loading';
  try{const r=await fetch('https://adventure.lotteworld.com/api/enjoy/attrctn/detail',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shopSysCd:String(id),storeCd:'HC01801',langCd:'HC01701'})});
    const v=(await r.json()).pifAtrctDtlVo||{},f=(v.mapFileList||[])[0],x=+v.pstnXcrd,y=+v.pstnYcrd;
    if(!f||!f.flPath||!(x>=0)||!(y>=0))MAPS[id]='none';
    else{const z=(f.flNm||'').match(/_(\d+)_(\d+)\./),W=z?+z[1]:570,H=z?+z[2]:427;MAPS[id]={fl:v.pstnCdNm||'',loc:v.pstnDesc||'',src:'https://adventure.lotteworld.com/api/upload'+f.flPath,px:((x+22)/W*100).toFixed(2),py:((y+58)/H*100).toFixed(2)}}
  }catch(e){MAPS[id]='none'}
  const a=ATTR.find(q=>String(q.id)===String(id));
  document.querySelectorAll('.amap[data-map="'+id+'"]').forEach(el=>{const h=mapHTML(a);if(h)el.outerHTML=h;else el.remove()})}
function openMap(id){const m=MAPS[id];if(!m||typeof m!=='object')return;const a=ATTR.find(q=>String(q.id)===String(id));
  const ov=document.createElement('div');ov.className='mapov';ov.setAttribute('role','dialog');ov.setAttribute('aria-label',(a?a.nm:'')+' 위치 지도');
  ov.innerHTML='<div class="mt">'+(a?a.nm:'')+'</div><button type="button" class="x" aria-label="닫기">×</button><div class="mapbox"><img alt="" src="'+m.src+'">'+mapTag(m)+'<span class="pin" style="left:'+m.px+'%;top:'+m.py+'%"></span></div>';
  const close=()=>{ov.remove();document.removeEventListener('keydown',esc)},esc=e=>{if(e.key==='Escape')close()};
  ov.querySelector('.x').onclick=close;ov.addEventListener('click',e=>{if(e.target===ov)close()});document.addEventListener('keydown',esc);
  document.body.appendChild(ov);const img=ov.querySelector('img');const ctr=()=>{const b=ov.querySelector('.mapbox');ov.scrollLeft=b.offsetWidth*m.px/100-ov.clientWidth/2;ov.scrollTop=b.offsetHeight*m.py/100-ov.clientHeight/2};if(img.complete)ctr();else img.onload=ctr;ov.querySelector('.x').focus()}
document.addEventListener('click',e=>{const el=e.target.closest&&e.target.closest('.amap[data-map]');if(el&&!el.classList.contains('ld')){e.stopPropagation();e.preventDefault();openMap(el.dataset.map)}},true);
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('amap')){e.preventDefault();openMap(e.target.dataset.map)}},true);

function resetUI(msg){

  box.innerHTML='<div class="label">지우려면 숫자 <b class="rcode num">'+resetCode+'</b> 를 입력하세요</div>'+

    '<button type="button" id="resetOk" class="ghost">지우기</button><button type="button" id="resetNo" class="ghost">취소</button></div>'+
    (msg?'<div class="label" style="color:var(--bad)">'+msg+'</div>':'');
